      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product:hover {
      transform: scale(1.03);
    }

    .product img {
      width: 100%;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
      aspect-ratio: 4 / 3;
    }

    .product h3 {
      font-size: 16px;
      margin: 10px 0 5px;
      text-align: center;
    }

    .product p {
      font-size: 14px;
      color: #555;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      background: #f0f0f0;
      color: #666;

// -------------------- Katalog render --------------------

const QTY_BTN_STYLE =
  "width: 24px; height: 26px; font-size: 14px; border: 1px solid #ccc; " +
  "border-radius: 4px; cursor: pointer; background: #f2f2f2;";

const QTY_INPUT_STYLE =
  "width: 40px; height: 26px; font-size: 13px; text-align: center; " +
  "border: 1px solid #004b8d; border-radius: 6px; padding: 2px; " +
  "background: #ffffff; color: #333;";

const ADD_BTN_STYLE =
  "margin-top:8px;background-color:#004b8d;color:white;border:none;" +
  "border-radius:5px;padding:6px 12px;cursor:pointer;";

function buildCatalog() {
  const nav = document.getElementById("categoryScroll");
  const container = document.getElementById("catalogContainer");

  catalog.forEach((category) => {
    const a = document.createElement("a");
    a.href = "#" + category.id;
    a.textContent = category.navLabel;
    nav.appendChild(a);

    const section = document.createElement("section");
    section.id = category.id;

    const h2 = document.createElement("h2");
    h2.className = "group-title";
    h2.textContent = category.title;
    section.appendChild(h2);

    const grid = document.createElement("div");
    grid.className = "product-grid";

    category.products.forEach((product, idx) => {
      grid.appendChild(createProductElement(product, category.id, idx));
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function createProductElement(product, catId, idx) {
  const div = document.createElement("div");
  div.className = "product";

  const img = document.createElement("img");
  img.src = product.img;
  img.alt = product.name;
  div.appendChild(img);

  const h3 = document.createElement("h3");
  h3.textContent = product.name;
  div.appendChild(h3);

  const brand = document.createElement("p");
  brand.textContent = "Macropark";
  div.appendChild(brand);

  const qtyWrap = document.createElement("div");
  qtyWrap.style.cssText = "display: flex; align-items: center; gap: 5px; margin-top: 10px;";

  const minusBtn = document.createElement("button");
  minusBtn.type = "button";
  minusBtn.textContent = "-";
  minusBtn.style.cssText = QTY_BTN_STYLE;
  minusBtn.addEventListener("click", function () { changeQty(this, -1); });
  qtyWrap.appendChild(minusBtn);

  const qtyInput = document.createElement("input");
  qtyInput.type = "number";
  qtyInput.className = "qty-input";
  qtyInput.min = "1";
  qtyInput.value = "1";
  qtyInput.style.cssText = QTY_INPUT_STYLE;
  qtyWrap.appendChild(qtyInput);

  const plusBtn = document.createElement("button");
  plusBtn.type = "button";
  plusBtn.textContent = "+";
  plusBtn.style.cssText = QTY_BTN_STYLE;
  plusBtn.addEventListener("click", function () { changeQty(this, 1); });
  qtyWrap.appendChild(plusBtn);

  div.appendChild(qtyWrap);

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.textContent = "🛒 Sepete Ekle";
  addBtn.style.cssText = ADD_BTN_STYLE;
  addBtn.addEventListener("click", function () { addToCart(this, catId, idx); });
  div.appendChild(addBtn);

  return div;
}

function scrollCategory(amount) {
  document.getElementById("categoryScroll").scrollBy({ left: amount, behavior: "smooth" });
}

function changeQty(button, delta) {
  const container = button.parentElement;
  const input = container.querySelector("input.qty-input");
  let current = parseInt(input.value) || 1;
  current += delta;
  if (current < 1) current = 1;
  input.value = current;
}

// -------------------- Sepet --------------------

let cart = JSON.parse(localStorage.getItem("cart") || "[]");

function addToCart(button, catId, idx) {
  const category = catalog.find((c) => c.id === catId);
  const product = category.products[idx];

  const parent = button.parentElement;
  const qtyInput = parent.querySelector("input[type=number]");
  const qty = parseInt(qtyInput.value) || 1;

  const existing = cart.find((item) => item.name === product.name);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({ name: product.name, qty: qty, img: product.img });
  }
  localStorage.setItem("cart", JSON.stringify(cart));
  alert(product.name + " sepete eklendi!");
}

function showCart() {
  const cartPopup = document.getElementById("cartPopup");
  const cartList = document.getElementById("cartItems");
  cartList.innerHTML = "";

  if (cart.length === 0) {
    const li = document.createElement("li");
    li.textContent = "Sepetiniz boş.";
    cartList.appendChild(li);
  } else {
    cart.forEach((item, index) => {
      const li = document.createElement("li");
      li.style.marginBottom = "10px";

      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.alignItems = "center";

      if (item.img) {
        const img = document.createElement("img");
        img.src = item.img;
        img.alt = "";
        img.style.cssText = "width:40px; height:40px; object-fit:cover; border-radius:5px; margin-right:10px;";
        row.appendChild(img);
      }

      const info = document.createElement("div");
      info.style.flex = "1";

      const strong = document.createElement("strong");
      strong.textContent = item.name;
      info.appendChild(strong);
      info.appendChild(document.createElement("br"));

      const qtyInput = document.createElement("input");
      qtyInput.type = "number";
      qtyInput.min = "1";
      qtyInput.value = item.qty;
      qtyInput.style.cssText = "width:50px; margin-top:5px; border-radius:5px; padding:4px;";
      qtyInput.addEventListener("change", function () {
        updateQty(index, this.value);
      });
      info.appendChild(qtyInput);

      row.appendChild(info);

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.textContent = "🗑";
      removeBtn.style.cssText = "margin-left:10px; background:#e74c3c; color:white; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;";
      removeBtn.addEventListener("click", function () {
        removeFromCart(index);
      });
      row.appendChild(removeBtn);

      li.appendChild(row);
      cartList.appendChild(li);
    });
  }

  cartPopup.style.display = "block";
}

function updateQty(index, value) {
  cart[index].qty = parseInt(value) || 1;
  localStorage.setItem("cart", JSON.stringify(cart));
}

function removeFromCart(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  showCart();
}

function clearCart() {
  cart = [];
  localStorage.setItem("cart", JSON.stringify(cart));
  showCart();
}

function closeCart() {
  document.getElementById("cartPopup").style.display = "none";
}

function sendToWhatsApp() {
  if (cart.length === 0) {
    alert("Sepetiniz boş!");
    return;
  }
  const lines = cart.map((item, i) => (i + 1) + ". " + item.name + " - Adet: " + item.qty);
  const message = "Merhaba, aşağıdaki ürünleri sipariş etmek istiyorum:%0A%0A" + lines.join("%0A");
  const whatsappLink = `https://wa.me/905453286699?text=${message}`;
  window.open(whatsappLink, "_blank");
}

document.addEventListener("DOMContentLoaded", buildCatalog);
</script>
